name: Connector tests
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps .
      - run: pytest -q -m 'not integration' --junitxml=reports/unit.xml
      - name: Validate deployment examples
        env:
          HEVY_API_KEY: mock-hevy-key
          HEVY_WGER_TOKEN: mock-wger-token
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.build.yaml config --quiet
          docker compose -f examples/docker-compose.wger.yml config --quiet
      - name: Build and smoke-test container
        run: |
          docker build --tag hevy-wger-connector:ci .
          docker run --rm hevy-wger-connector:ci --help
          test "$(docker run --rm --entrypoint id hevy-wger-connector:ci -u)" = 10001
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-reports
          path: reports/
  integration:
    # This standalone repo cannot assume the private sibling harness is public.
    if: github.event_name == 'workflow_dispatch' && vars.WGER_HARNESS_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hevy-wger-connector
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.WGER_HARNESS_REPOSITORY }}
          token: ${{ secrets.WGER_HARNESS_TOKEN || github.token }}
          path: wger-addon-harness
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python test_harness.py
        working-directory: hevy-wger-connector
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-reports
          path: hevy-wger-connector/reports/
