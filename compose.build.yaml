# Developer setup: docker compose -f compose.build.yaml up --build -d
name: hevy-wger-connector
services:
  connector:
    build: .
    image: hevy-wger-connector:local
    env_file: .env
    init: true
    restart: unless-stopped
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes: [state:/data]
    healthcheck:
      test: [CMD, hevy-wger, status, --health]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
volumes:
  state:
