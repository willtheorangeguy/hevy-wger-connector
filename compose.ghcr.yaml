name: hevy-wger-connector
services:
  connector:
    image: ${CONNECTOR_IMAGE:-ghcr.io/willtheorangeguy/hevy-wger-connector}:${CONNECTOR_VERSION:-0.1.0}
    env_file: .env
    init: true
    restart: unless-stopped
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes: [state:/data]
    healthcheck:
      test: [CMD, hevy-wger, status, --health]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
volumes:
  state:
