[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hevy-wger-connector"
version = "0.1.0"
description = "Reviewable, resumable one-way Hevy strength workout imports into wger"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
hevy-wger = "hevy_wger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real harness wger and the mock Hevy service"]
